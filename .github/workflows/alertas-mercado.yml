name: Avisos de mercado

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # a cada 30 min, 10h às 18h30 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: dados-main
  cancel-in-progress: false

jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/alertas.py mercado
      - name: Guarda o que já foi avisado
        run: |
          git config user.name  "robo-alertas"
          git config user.email "robo-alertas@users.noreply.github.com"
          git add data/alertas_estado.json
          git diff --cached --quiet || (git commit -m "estado dos avisos" && git pull --rebase -q && git push)
