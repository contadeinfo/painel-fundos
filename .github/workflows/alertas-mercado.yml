name: Avisos de mercado

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # a cada 30 min, 10h às 18h30 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: dados-main
  cancel-in-progress: false

jobs:
  mercado:
    runs-on: ubuntu-latest
    env:
      PAINEL_CHAVE: ${{ secrets.PAINEL_CHAVE }}
      PRIVADO_JSON: ${{ secrets.PRIVADO_JSON }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abre dados privados
        run: pip install -q cryptography && python scripts/privado.py abrir
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          pip install -q matplotlib
          python scripts/alertas.py mercado
      - name: Fecha dados privados (nada sai sem passar por aqui)
        run: python scripts/privado.py fechar
      - name: Guarda o que já foi avisado
        run: |
          git config user.name  "robo-alertas"
          git config user.email "robo-alertas@users.noreply.github.com"
          git add data/alertas_estado.json data/graficos 2>/dev/null; git add -A data/alertas_estado.json data/p
          git diff --cached --quiet || (git commit -m "estado dos avisos" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep $((i*7)); done)
