name: P/L da bolsa (CVM + B3)

on:
  schedule:
    - cron: '25 23 * * 1-5'   # seg-sex 20h25 de Brasília (depois do arquivo de cotações da B3 do dia)
  workflow_dispatch:
    inputs:
      forca_balancos:
        description: 'Reler os balanços da CVM (ITR/DFP) mesmo fora de segunda-feira'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/valuation.py
        env:
          FORCA_BALANCOS: ${{ github.event.inputs.forca_balancos }}
      - name: Publica
        run: |
          git config user.name  "robo-peers"
          git config user.email "robo-peers@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "sem mudanças" || (git commit -m "valuation $(date -u +%F)" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep $((i*7)); done)
